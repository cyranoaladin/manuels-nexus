artifact_type: baseline_qualification_policy
control_digest: sha256:e3cceb1c434a6f35e9a71f2115836bdf6fdb6ff243c5330b007c0a93da6e1c22
decision:
  approved_by: Alaeddine Ben Rhouma
  approver_role: Direction scientifique et éditoriale Nexus Réussite
  baseline_purpose: debt_regression_control
  id: baseline-debt-extension-collection-2026-08-08
  provisional_after_freeze: false
  ref: audit/BASELINE_QUALIFICATION_DECISION.md#decision-baseline-debt-extension-collection-2026-08-08
  release_acceptance: false
initial_policy:
  prohibited_outputs:
    - accepted_exception
    - false_positive
    - fixed
owners:
  direction_editoriale_pedagogique:
    scope:
      - pedagogy
      - nexus_mastery_loop
      - student_teacher_variants
      - remediation
      - editorial_content
      - terminology
  direction_scientifique_programme:
    scope:
      - mathematics
      - official_programme
      - demonstrations
      - qcm
      - corrections
      - numerical_results
  ingenierie_build_qualite:
    scope:
      - metadata
      - inventory
      - assemblies
      - latex
      - python
      - ci
      - pdf
      - visual_baselines
rules:
  - order: 1
    id: blocking-contract-not-approved
    match:
      categories: [blocking_statuses]
      field_equals:
        scope: contract
    decision:
      disposition: open_debt
      owner: ingenierie_build_qualite
      reason: Contrat de chapitre non approuvé, y compris le statut complete.
      release_blocking: true
  - order: 2
    id: blocking-scientific-object
    match:
      categories: [blocking_statuses]
      field_equals:
        scope: object
      field_in:
        object_type:
          - cours
          - methode
          - exercice
          - evaluation
          - qcm
          - corrige
          - corrige_evaluation
          - evaluation_corrige
          - td
    decision:
      disposition: open_debt
      owner: direction_scientifique_programme
      reason: Contenu disciplinaire ou corrigé sans statut de publication approuvé.
      release_blocking: true
  - order: 3
    id: blocking-pedagogical-object
    match:
      categories: [blocking_statuses]
      field_equals:
        scope: object
      field_in:
        object_type:
          - amenagee
          - coup_de_pouce
          - projet
          - qcm_diagnostics
          - remediation
    decision:
      disposition: open_debt
      owner: direction_editoriale_pedagogique
      reason: Objet pédagogique, de remédiation ou de variante non approuvé.
      release_blocking: true
  - order: 4
    id: unassembled-object
    match:
      categories: [unassembled_objects]
    decision:
      disposition: open_debt
      owner: ingenierie_build_qualite
      reason: Le contenu existe mais aucun assemblage déclaré ne l'inclut.
      release_blocking: true
  - order: 5
    id: broken-meta-reference
    match:
      categories: [broken_meta_references]
    decision:
      disposition: open_debt
      owner: ingenierie_build_qualite
      reason: Référence META cassée dans une source de production.
      release_blocking: true
  - order: 6
    id: unavailable-inspiration-source
    match:
      categories: [unavailable_inspiration_sources]
    decision:
      disposition: open_debt
      owner: direction_editoriale_pedagogique
      reason: Source éditoriale d'inspiration déclarée mais indisponible.
      release_blocking: true
  - order: 7
    id: missing-chapter-deliverable
    match:
      categories: [chapters_not_in_manual]
    decision:
      disposition: open_debt
      owner: direction_editoriale_pedagogique
      reason: Chapitre ou livrable absent de l'assemblage du manuel.
      release_blocking: true
  - order: 8
    id: missing-assembler
    match:
      categories: [missing_assemblers]
    decision:
      disposition: open_debt
      owner: ingenierie_build_qualite
      reason: Contenu présent mais assembleur de manuel manquant.
      release_blocking: true
  - order: 9
    id: unattributed-pdf
    match:
      categories: [unattributed_pdfs]
    decision:
      disposition: open_debt
      owner: ingenierie_build_qualite
      reason: PDF suivi sans attribution fiable à un livrable.
      release_blocking: true
  - order: 10
    id: missing-correction
    match:
      categories: [missing_corrections]
    decision:
      disposition: open_debt
      owner: direction_scientifique_programme
      reason: Correction disciplinaire absente.
      release_blocking: true
  - order: 11
    id: broken-latex-reference
    match:
      categories: [broken_latex_references]
    decision:
      disposition: open_debt
      owner: ingenierie_build_qualite
      reason: Référence LaTeX cassée dans une source de production.
      release_blocking: true
  - order: 12
    id: harvest-candidate
    match:
      categories: [harvest_candidate]
      source_glob: "**/_harvest/**/*.candidate.tex"
    decision:
      disposition: harvest_candidate
      owner: direction_editoriale_pedagogique
      reason: Candidat de récolte contrôlé séparément et non publiable.
      release_blocking: false
  - order: 13
    id: generated-dependency-proved
    match:
      categories: [generated_dependency]
      all_true:
        - producer_identified
        - producer_tested
    decision:
      disposition: generated_dependency
      owner: ingenierie_build_qualite
      reason: Dépendance générée dont le producteur est identifié et testé.
      release_blocking: false
  - order: 14
    id: generated-dependency-unproved
    match:
      categories: [generated_dependency]
      not_all_true:
        - producer_identified
        - producer_tested
    decision:
      disposition: open_debt
      owner: ingenierie_build_qualite
      reason: Dépendance générée sans producteur observé et testé.
      release_blocking: true
  - order: 15
    id: intentional-reuse-proved
    match:
      categories: [duplicate_assembly_objects]
      all_true:
        - editorial_decision
        - no_pdf_duplicate
        - variant_identified
    decision:
      disposition: intentional_reuse
      owner: direction_editoriale_pedagogique
      reason: Réutilisation voulue, variante identifiée et absence de doublon PDF prouvée.
      release_blocking: false
  - order: 16
    id: intentional-reuse-unproved
    match:
      categories: [duplicate_assembly_objects]
      not_all_true:
        - editorial_decision
        - no_pdf_duplicate
        - variant_identified
    decision:
      disposition: open_debt
      owner: direction_editoriale_pedagogique
      reason: Réutilisation sans preuve éditoriale complète.
      release_blocking: true
  - order: 17
    id: blocking-scientific-algorithm-experiment
    match:
      categories: [blocking_statuses]
      field_equals:
        scope: object
      field_in:
        object_type:
          - algorithme
          - experimentation
    decision:
      disposition: open_debt
      owner: direction_scientifique_programme
      reason: Algorithme ou expérimentation scientifique sans statut de publication approuvé.
      release_blocking: true
  - order: 18
    id: unclassified-source-type
    match:
      categories: [unclassified_types]
    decision:
      disposition: open_debt
      owner: ingenierie_build_qualite
      reason: Type d'objet non classé dans la taxonomie canonique.
      release_blocking: true
