# Autorité réglementaire officielle — édition 2026-2027 — six manuels Nexus
#
# Sources exclusives : Bulletin officiel (education.gouv.fr/bo/...),
# Légifrance (JORF, pour la date et le texte de l'arrêté), Éduscol
# (ressources d'accompagnement). Aucun blog, aucun manuel concurrent, aucune
# ancienne matrice interne utilisée seule comme autorité.
#
# Trois namespaces JAMAIS mélangés :
#
#   programme_d_enseignement : ce qui doit être enseigné (BO programme).
#   definition_d_epreuve     : durée, structure, pondération, calculatrice,
#                              nature des parties — le texte qui DÉFINIT
#                              l'épreuve, pas un sujet réel.
#   sujets_d_examen          : preuves empiriques de mise en œuvre (sujets
#                              réels, banques). Jamais une autorité
#                              suffisante pour ajouter ou retirer une notion
#                              du programme. Toujours daté par cohorte —
#                              un sujet composé sous l'ancien programme ne
#                              prouve rien sur le nouveau.
#
# Chaque entrée a été vérifiée indépendamment le 2026-08-22 par récupération
# directe des pages education.gouv.fr/bo/... et/ou legifrance.gouv.fr (JORF),
# pas seulement recopiée d'un registre interne préexistant. Le registre
# opérationnel préexistant `docs/programmes/PROGRAMMES_2026_2027.yaml`
# (généré et vérifié le 2026-08-11, textes déposés et empreintés SHA-256
# sous `Mathematiques/manuel-maths/sources/txt/` et
# `NSI/corpus_nsi/00_programmes_officiels/`) reste la source de vérité
# opérationnelle consommée par le pipeline d'inventaire (registre PDF,
# gates). Ce fichier est la couche d'audit T2 : il ajoute la date de
# vérification, la distinction programme/épreuve/sujets, et des trouvailles
# absentes du registre opérationnel. Il ne le contredit sur aucun point
# commun du namespace programme_d_enseignement.

schema_version: 2
edition: "2026-2027"
verified_on: "2026-08-22"
verification_method: >-
  Recherche web + récupération directe des pages officielles
  education.gouv.fr/bo/... et legifrance.gouv.fr/jorf/... pour chacun des
  six manuels, indépendamment du registre opérationnel préexistant.

