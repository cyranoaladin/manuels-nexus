# =============================================================================
# NAMESPACE B — DEFINITION_D_EPREUVE
# =============================================================================
# Durée, structure, pondération, calculatrice, nature des parties. Ne
# détermine JAMAIS ce qui doit être enseigné — voir programme_d_enseignement.
definition_d_epreuve:

  1SPE_EPREUVE_ANTICIPEE:
    manual: "1SPE"
    intitule: "Épreuve anticipée de mathématiques (voie générale)"
    structure_verification_status: CONFIRMED
    duree_h: 2
    coefficient: 2
    calculatrice: false
    partie_1:
      contenu: "QCM automatismes"
      points_sur_20: 6
    partie_2:
      contenu: "2 à 3 exercices indépendants"
      points_sur_20: 14
    structure_evidence: >-
      Structure (2h, coeff 2, sans calculatrice, QCM 6pts + exercices 14pts)
      confirmée par la page évergreen education.gouv.fr
      (reussir-au-lycee/epreuve-anticipee-de-mathematiques-en-classe-de-premiere-450607)
      décrivant la réforme de façon générale, pas limitée à une session, et
      cohérente avec les textes session 2027 (MENE2515469N). Fetch direct de
      la page en 403 ; contenu confirmé par extraits WebSearch indexés.
    annual_annexe_note: >-
      Seule l'annexe listant les automatismes évaluables est republiée
      chaque année pour chaque session (ex. MENE2516240N pour la session
      2027). Le texte structurant lui-même (2h/coeff2/QCM6+14) n'est pas
      republié annuellement.
    cohort_evidence:
      session_2027_confirmed:
        official_ref: "MENE2515469N"
        note_date: "2025-06-10"
        bo: "Hebdo n°24/2025"
        authority_url: "https://www.education.gouv.fr/bo/2025/Hebdo24/MENE2515469N"
        annexe_automatismes_ref: "MENE2516240N"
        cohort: "élèves de Première durant l'année scolaire 2025-2026"
      session_2028_relevant_cohort:
        cohort: "élèves de Première durant l'année scolaire 2026-2027 (édition Nexus 2026-2027)"
        session_specific_text_found: false
        note: >-
          AMBIGUÏTÉ RÉELLE NON PLEINEMENT FERMÉE : aucun texte "session 2028"
          spécifique trouvé (ni structure, ni annexe automatismes). La
          continuité de la structure (2h/coeff2/QCM6+14) au-delà de la
          session 2027 est une inférence raisonnable (page évergreen
          education.gouv.fr, réforme structurelle et non annuelle), pas une
          confirmation positive absolue par un texte session 2028 nommément
          daté. Revérifier avant publication finale si un texte "session
          2028" paraît (généralement publié au printemps précédent, donc
          possible dès 2027).

