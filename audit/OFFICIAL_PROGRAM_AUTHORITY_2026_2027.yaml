  TNSI_EPREUVE:
    manual: "TNSI"
    intitule: >-
      Épreuve de l'enseignement de spécialité numérique et sciences
      informatiques de la classe de terminale de la voie générale à compter
      de la session 2026 de l'examen du baccalauréat
    official_ref: "MENE2516123N"
    note_date: "2025-07-04"
    bo_number: "31"
    bo_date: "2025-08-21"
    authority_url: "https://www.education.gouv.fr/bo/2025/Hebdo31/MENE2516123N"
    mirror_url: "https://sti.eduscol.education.fr/sites/eduscol.education.fr.sti/files/textes/bac-voie-generale/specialite-nsi-numerique-et-sciences-informatiques/18323-boenjs-n31-du-21-08-2025.pdf"
    replaces: "note de service n° 2020-30 du 11 février 2020"
    applicable_from_session: 2026
    applicable_2027_confirmed: false
    applicable_2027_note: >-
      Le texte dit "à compter de la session 2026" sans date de fin ; couvre
      donc la session 2027 sauf texte ultérieur non trouvé. Absence de
      contre-indication, pas confirmation positive absolue.
    # Représentation correcte : deux épreuves notées chacune sur 20, la note
    # finale étant une moyenne pondérée. Ne PAS stocker written_points=15/
    # practical_points=5 comme si l'écrit était noté directement sur 15 et
    # la pratique sur 5 — corrigé après relecture du mandat.
    ecrit:
      duree_h: 3.5
      structure: "trois exercices indépendants"
      raw_scale: 20
      weight: 0.75
    pratique:
      duree_h: 1
      structure: "résolution de problèmes + programmation sur machine"
      raw_scale: 20
      weight: 0.25
      banque_url: "https://sujets.examens-concours.gouv.fr/delos/public/bgt/nsi"
    equivalent_contribution_pedagogical_explanation_only: "15/20 + 5/20 (ne pas stocker comme échelle réelle)"
    candidats_particuliers:
      scolaires: "écrit + pratique"
      individuels_ou_prive_hors_contrat: >-
        Dispense de l'épreuve pratique selon la note officielle ; note
        constituée à partir de l'écrit selon le texte (détail exact du
        mécanisme de substitution non extrait dans cette passe — à confirmer
        avant de le citer comme preuve vérifiée). Ceci ne modifie en rien le
        programme d'enseignement : le manuel peut fournir un parcours
        "épreuve pratique" optionnel, le cours canonique reste fondé sur le
        programme.
    prior_ref: "note de service n°2020-30 du 11 février 2020 (points écrit/pratique 12/8, remplacée)"
    deposit_status: >-
      NON déposé/empreinté localement (fetch direct education.gouv.fr en
      403 ; PDF miroir académique trop volumineux pour être récupéré dans
      cette passe). Trouvaille nouvelle par rapport au registre opérationnel
      préexistant, qui marquait ce point `declare_par_instruction_humaine` /
      `source_deposee: false`. Comble ce point mais reste à déposer avant
      d'être cité comme preuve vérifiée dans le pipeline (règle R7).

