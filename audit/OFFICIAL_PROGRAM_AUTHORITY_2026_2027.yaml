# Preuves empiriques de mise en œuvre. JAMAIS une autorité suffisante pour
# ajouter ou retirer une notion du programme_d_enseignement. Toujours daté
# par cohorte scolaire, jamais par date de composition seule.
sujets_d_examen:

  1SPE_SUJETS_JUIN_2026:
    manual: "1SPE"
    cohort_school_year: "2025-2026"
    program_in_force_for_this_cohort: "MENE1901633A-1SPE (2019, ancien programme)"
    subject_2026_program_authority: false
    rule: >-
      Les sujets de juin 2026 correspondent à l'année scolaire 2025-2026,
      donc à l'ANCIEN programme alors en vigueur. Le nouveau programme
      MENE2602917A entre en application à la rentrée de septembre 2026.
      SUBJECT_2026_PROGRAM_AUTHORITY = FALSE : ces sujets ne peuvent PAS
      servir de preuve de couverture du nouveau programme 1SPE 2026. Usage
      autorisé uniquement : format, durée, style, niveau de rédaction,
      types de consignes, organisation de l'épreuve — jamais contenu
      exigible du nouveau programme.
    future_use: >-
      Si des sujets zéro ou documents officiels explicitement rattachés au
      programme 2026 apparaissent, les intégrer séparément ici avec leur
      propre date et autorité — ne jamais les fusionner avec cette entrée.

