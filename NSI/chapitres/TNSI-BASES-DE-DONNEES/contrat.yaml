chapitre: TNSI-BASES-DE-DONNEES
niveau: TNSI
theme: BASES-DE-DONNEES
titre: "Bases de données relationnelles"
statut: valide   # valide humainement le 2026-08-06 (branche terminale/collection-v1, creation ex nihilo)

capacites:
  - { code: C01A, ref_capacite: T-BDD-01A, libelle_eleve: "Je sais identifier les concepts définissant le modèle relationnel (relation, attribut, domaine, clé, schéma)." }
  - { code: C01B, ref_capacite: T-BDD-01B, libelle_eleve: "Je sais distinguer structure et contenu d'une base de données." }
  - { code: C01C, ref_capacite: T-BDD-01C, libelle_eleve: "Je sais repérer les anomalies dans le schéma d'une base de données." }
  - { code: C02,  ref_capacite: T-BDD-02,  libelle_eleve: "Je sais identifier les services rendus par un SGBD relationnel (persistance, concurrence, efficacité, sécurisation)." }
  - { code: C03A, ref_capacite: T-BDD-03A, libelle_eleve: "Je sais identifier les composants d'une requête SQL." }
  - { code: C03B, ref_capacite: T-BDD-03B, libelle_eleve: "Je sais construire des requêtes d'interrogation avec SELECT et FROM." }
  - { code: C03C, ref_capacite: T-BDD-03C, libelle_eleve: "Je sais construire des requêtes d'interrogation avec WHERE." }
  - { code: C03D, ref_capacite: T-BDD-03D, libelle_eleve: "Je sais construire des requêtes d'interrogation avec JOIN." }
  - { code: C03E, ref_capacite: T-BDD-03E, libelle_eleve: "Je sais construire des requêtes d'interrogation avec ORDER BY." }
  - { code: C03F, ref_capacite: T-BDD-03F, libelle_eleve: "Je sais construire des requêtes d'insertion avec INSERT." }
  - { code: C03G, ref_capacite: T-BDD-03G, libelle_eleve: "Je sais construire des requêtes de mise à jour avec UPDATE." }
  - { code: C03H, ref_capacite: T-BDD-03H, libelle_eleve: "Je sais construire des requêtes de suppression avec DELETE." }

prerequis:
  - { code: R1, libelle: "Types construits : p-uplets, tableaux, dictionnaires", chapitre_origine: "1NSI-TYPES-CONSTRUITS" }
  - { code: R2, libelle: "Structures de données (liste vs dictionnaire)", chapitre_origine: "TNSI-STRUCTURES-DONNEES" }

situation_accroche: >
  Une bibliotheque gere des milliers de livres, d'usagers et d'emprunts : comment
  stocker ces informations sans duplication ni incoherence, et retrouver en un instant
  tous les emprunts en retard d'un usager donne ? Ce chapitre introduit le modele
  relationnel et le langage SQL pour interroger et manipuler des bases de donnees.

temps_estime_h: { parcours1: 16, parcours2: 13, parcours3: 10 }
