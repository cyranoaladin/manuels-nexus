situation_accroche: >
  Un smartphone integre en quelques millimetres carres un processeur, de la memoire et
  des interfaces radio ; un serveur web execute des milliers de processus simultanement
  sans qu'ils ne se marchent dessus ; un paquet traverse des dizaines de routeurs pour
  atteindre sa destination ; et une connexion HTTPS protege des donnees bancaires sur un
  reseau public. Ce chapitre explore les principes qui rendent tout cela possible :
  integration materielle, gestion des processus, routage et cryptographie.

temps_estime_h: { parcours1: 14, parcours2: 11, parcours3: 8 }
