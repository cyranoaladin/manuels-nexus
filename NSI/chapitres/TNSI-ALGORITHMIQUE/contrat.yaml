  - { code: R2, libelle: "Récursivité", chapitre_origine: "1NSI-LANGAGE" }

situation_accroche: >
  Trouver le plus court chemin dans un reseau de metro, savoir si un labyrinthe possede
  une solution, rechercher un mot dans un texte de plusieurs milliers de pages : ces
  problemes se resolvent grace a des algorithmes specifiques sur les arbres et les
  graphes, et a des methodes de conception generales (diviser pour regner,
  programmation dynamique) qui evitent de refaire les memes calculs.

temps_estime_h: { parcours1: 22, parcours2: 18, parcours3: 14 }
