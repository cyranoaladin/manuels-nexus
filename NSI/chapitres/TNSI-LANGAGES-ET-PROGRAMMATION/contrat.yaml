prerequis:
  - { code: R1, libelle: "Fonctions, récursivité de base", chapitre_origine: "1NSI-LANGAGE" }
  - { code: R2, libelle: "Classes Python", chapitre_origine: "TNSI-STRUCTURES-DONNEES" }

situation_accroche: >
  Un meme algorithme de tri peut s'ecrire en Python, en C ou en OCaml : le langage change,
  mais ce qui est calculable ne change pas. Certains programmes, en revanche, ne peuvent
  jamais etre garantis de s'arreter par un simple test automatique -- c'est le celebre
  probleme de l'arret. Ce chapitre explore ces questions fondamentales, ainsi que les
  outils concrets du quotidien d'un programmeur ou d'une programmeuse : la recursivite,
  les bibliotheques et modules, les paradigmes de programmation, et la traque des bugs.

temps_estime_h: { parcours1: 16, parcours2: 13, parcours3: 10 }
