  - { code: C2, ref_capacite: P-ARCH-02B, libelle_eleve: "Je sais dérouler le fonctionnement d'un protocole simple de récupération de perte de paquets (bit alterné)." }
  - { code: C3, ref_capacite: P-ARCH-02C, libelle_eleve: "Je sais simuler un réseau simple et déterminer si deux machines peuvent communiquer." }
  - { code: C4, ref_capacite: P-ARCH-04A, libelle_eleve: "Je sais identifier le rôle des capteurs et des actionneurs." }
