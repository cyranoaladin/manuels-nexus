  - { code: R2, libelle: "Protocole TCP/IP (vu en Seconde SNT)", chapitre_origine: "SNT" }

situation_accroche: >
  Envoyer une photo par Internet ne se fait pas d'un seul bloc : elle est découpée en
  petits morceaux, envoyés séparément, parfois par des chemins différents, puis
  reconstitués à l'arrivée. Que se passe-t-il si l'un de ces morceaux se perd en route ?
  Comment le réseau détecte-t-il et corrige-t-il cette perte ? Ce chapitre explore le
  découpage en paquets, un protocole simple de récupération de perte, la simulation d'un
  réseau, et le lien entre le monde numérique et le monde physique via capteurs et
  actionneurs.

temps_estime_h: { parcours1: 9, parcours2: 7, parcours3: 6 }
