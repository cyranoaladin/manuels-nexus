name: CI audit collection Phase 0

'on':
  pull_request:
  push:
    branches:
      - finalisation/collection-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-phase-0:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      LC_ALL: C.UTF-8
      PYTHONHASHSEED: "0"
      TZ: UTC

    steps:
      - name: Extraire la branche auditée
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Initialiser les chemins temporaires du runner
        shell: bash
        run: |
          set -euo pipefail

          test -n "${RUNNER_TEMP:-}"
          artifact_dir="${RUNNER_TEMP}/ci-audit-artifacts"

          mkdir --parents "$artifact_dir"

          {
            printf 'CI_ARTIFACT_DIR=%s\n' "$artifact_dir"
            printf 'COVERAGE_FILE=%s\n' "$artifact_dir/.coverage"
          } >> "$GITHUB_ENV"

          printf 'Répertoire des preuves : %s\n' "$artifact_dir"

      - name: Attacher le SHA audité sans changer de commit
        shell: bash
        run: |
          current_branch="$(git branch --show-current)"
          if [ -z "$current_branch" ]; then
            branch_name="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
            test -n "$branch_name"
            git switch --create "$branch_name"
          fi
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Installer Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.11"

      - name: Installer les outils système des tests complets
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            fonts-dejavu-core \
            fonts-jetbrains-mono \
            fonts-texgyre \
            fonts-texgyre-math \
            imagemagick-6.q16 \
            poppler-utils \
            qpdf \
            texlive-fonts-recommended \
            texlive-lang-french \
            texlive-latex-extra \
            texlive-luatex \
            texlive-plain-generic \
            texlive-science

      - name: Installer les dépendances Python figées
        run: |
          python -m pip install --disable-pip-version-check \
            --no-deps \
            --requirement requirements-ci-audit.txt
          python -m pip check

      - name: Vérifier les outils figés de preuve PDF
        run: |
          python - <<'PY'
          import pikepdf
          assert pikepdf.__version__ == "8.7.1"
          PY
          qpdf --version

      - name: Lint Phase 0
        run: |
          python -m ruff check \
            scripts \
            tests/test_build_manifest.py \
            tests/test_check_charte_sync.py \
            tests/test_ci_audit_collection.py \
            tests/test_inventory_collection.py

      - name: Typage Phase 0
        run: |
          python -m mypy \
            --cache-dir "$RUNNER_TEMP/mypy-cache"

      - name: Parser tous les JSON et YAML suivis
        run: |
          python scripts/ci_audit_collection.py validate-data \
            --root . \
            --output "$CI_ARTIFACT_DIR/structured-data.json"

      - name: Gates Phase 0 aux codes exacts
        run: |
          python scripts/ci_audit_collection.py run-gates \
            --root . \
            --output-dir "$CI_ARTIFACT_DIR/gates" \
            --require-clean \
            --check \
            --validate-model \
            --fail-on-new \
            --release-strict

      - name: Suite complète avec couverture lignes et branches
        if: always()
        run: |
          python -m pytest \
            --import-mode=importlib \
            --cov=scripts \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml:"$CI_ARTIFACT_DIR/coverage.xml" \
            --cov-report=html:"$CI_ARTIFACT_DIR/coverage-html"

      - name: Génération double et comparaison octet exacte
        if: always()
        run: |
          python scripts/ci_audit_collection.py compare-generation \
            --root . \
            --artifact-dir "$CI_ARTIFACT_DIR/generation"

      - name: Publier toutes les preuves Phase 0
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: audit-collection-${{ github.sha }}
          path: |
            ${{ runner.temp }}/ci-audit-artifacts
            audit/BUILD_MANIFEST.json
          if-no-files-found: error
          retention-days: 14
