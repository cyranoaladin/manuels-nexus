[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = [
  "Mathematiques/manuel-maths/tests",
  "NSI/tests",
  "tests",
]

[tool.coverage.run]
branch = true
source = ["scripts"]
# Le fichier de donnees de couverture ne doit jamais atterrir dans l'arbre de
# travail : un `.coverage` non suivi suffit a faire echouer les gates du
# manifeste sur "depot Git sale". La CI positionne deja COVERAGE_FILE, qui a
# la priorite sur cette valeur ; ceci couvre les executions locales.
data_file = "/tmp/nexus-coverage/.coverage"

[tool.coverage.report]
fail_under = 76.83
precision = 2
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.12"
mypy_path = "."
explicit_package_bases = true
files = [
  "scripts/baseline_qualification.py",
  "scripts/check_charte_sync.py",
  "scripts/ci_audit_collection.py",
  "scripts/inventory_graph.py",
  "scripts/inventory_pdf.py",
  "scripts/inventory_reports.py",
]
# Dette de typage hors gate Phase 0 : inventory_collection.py,
# inventory_assembly.py et build_manifest.py nécessitent un lot dédié.
# Ils ne sont ni masqués par ignore_errors, ni déclarés comme déjà typés.
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true

[tool.ruff]
target-version = "py312"

# Les fichiers `chapitres/*/code/*.py` ne sont pas des modules : ce sont les
# programmes canoniques auxquels un listing publie est lie par egalite d'AST.
# Un listing de manuel s'appuie legitimement sur le modele du chapitre --
# `ajouter_gestionnaire` d'une fiche IHM, par exemple, est defini dans le cours
# et re-declare dans le bloc de verification qui l'execute. F821 y signale donc
# un nom que l'eleve connait, et rendre ces fichiers autonomes romprait
# precisement le lien qu'ils servent a etablir. Ce que le code fait reste
# prouve par les blocs % BEGIN-VERIFY, qui sont executes.
[tool.ruff.lint.per-file-ignores]
"*/chapitres/*/code/*.py" = ["F821"]
