# Registre canonique des programmes officiels — collection Nexus Réussite 2026-2027
#
# Ce fichier fige, pour chacun des six manuels, le texte réglementaire qui fait
# autorité pour l'édition 2026-2027. Il prévaut sur toute mention de programme
# figurant ailleurs dans le dépôt (référentiels, contrats, rapports).
#
# Règle structurante : un programme publié n'est pas un programme applicable.
# Les nouveaux programmes de Terminale publiés au BO du 2 avril 2026 n'entrent
# en application qu'à la rentrée 2027-2028. Ils ne doivent donc alimenter aucun
# contenu exigible de l'édition courante. Le travail correspondant vit dans
# `backlog_terminal_2027_2028/`.
#
# Généré et vérifié le 2026-08-11. Empreintes SHA-256 des extraits texte
# déposés sous `sources/`.

