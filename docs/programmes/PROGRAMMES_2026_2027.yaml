epreuves:

  EXAM-EA-MATHS-2027:
    intitule: "Épreuve anticipée de mathématiques"
    premiere_session: 2027
    concerne: ["1SPE"]
    reference_bo: "BO n° 24 de 2025 — note de service MENE2515469N"
    url: "https://www.education.gouv.fr/bo/2025/Hebdo24/MENE2515469N"
    source_deposee: false
    exigence_manuel: >-
      La préparation à cette épreuve est structurante et non terminale : elle
      irrigue l'année entière par les automatismes, les questions sans
      calculatrice, les QCM, les exercices courts et les sujets de deux heures,
      et non par un unique chapitre de révision en fin d'ouvrage.
    a_faire: "déposer et empreinter le texte officiel dans sources/"

  EXAM-BAC-NSI-2026:
    intitule: "Épreuve de spécialité numérique et sciences informatiques"
    premiere_session: 2026
    concerne: ["TNSI"]
    modalites:
      ecrit:
        duree_h: 3.5
        structure: "3 exercices indépendants"
      pratique:
        duree_h: 1
    origine_declaration: "instruction humaine du 2026-08-11"
    source_deposee: false
    status: "declare_par_instruction_humaine"
    a_faire: >-
      Déposer et empreinter le texte officiel définissant ces modalités avant
      de déclarer TNSI publiable. Tant que la source n'est pas déposée, la règle
      R7 interdit de présenter ces modalités comme vérifiées : elles sont
      tracées ici comme décision humaine, non comme constat réglementaire.
      Ce point figure déjà dans NSI/A_VALIDER_HUMAIN.md (vérification R7).

  EXAM-BAC-SPE-MATHS:
    intitule: "Épreuve de spécialité mathématiques"
    concerne: ["TSPE_2026_2027"]
    source_deposee: false
    a_faire: "déposer le texte de modalités en vigueur pour la session 2027"

  EXAM-CONTROLE-CONTINU:
    intitule: "Évaluation en contrôle continu"
    concerne: ["TCOMPL", "TEXPERTES"]
    note: "Enseignements optionnels évalués en contrôle continu."

