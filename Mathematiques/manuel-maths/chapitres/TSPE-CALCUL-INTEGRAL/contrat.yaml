situation_accroche: >
  La distance parcourue par un mobile s'obtient en integrant sa vitesse au cours du
  temps. Comment justifier rigoureusement ce lien entre aire sous une courbe et
  primitive ? Ce chapitre etablit le theoreme fondamental du calcul integral et les
  outils de calcul associes.

