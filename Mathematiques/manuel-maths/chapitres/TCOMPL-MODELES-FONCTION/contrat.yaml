chapitre: TCOMPL-MODELES-FONCTION
niveau: TCOMPL
theme: MODELES-FONCTION
titre: "Modèles définis par une fonction d'une variable"
statut: valide   # valide humainement le 2026-08-06 (branche terminale/collection-v1, creation ex nihilo)

capacites:
  - { code: C1, ref_capacite: TCOMPL-MF-C1, libelle_eleve: "Je sais calculer la dérivée d'une fonction, calculer des limites, et dresser un tableau de variation." }
  - { code: C2, ref_capacite: TCOMPL-MF-C2, libelle_eleve: "Je sais exploiter un tableau de variation pour déterminer le nombre de solutions d'une équation f(x) = k ou résoudre une inéquation f(x) ≤ k." }
  - { code: C3, ref_capacite: TCOMPL-MF-C3, libelle_eleve: "Je sais déterminer une valeur approchée ou un encadrement d'une solution d'une équation f(x) = k, par balayage ou dichotomie." }
  - { code: C4, ref_capacite: TCOMPL-MF-C4, libelle_eleve: "Je sais reconnaître graphiquement une fonction convexe, concave, ou un point d'inflexion." }
  - { code: C5, ref_capacite: TCOMPL-MF-C5, libelle_eleve: "Je sais étudier la convexité ou la concavité d'une fonction deux fois dérivable." }
  - { code: C6, ref_capacite: TCOMPL-MF-C6, libelle_eleve: "Je sais représenter un nuage de points et calculer les coordonnées de son point moyen." }
  - { code: C7, ref_capacite: TCOMPL-MF-C7, libelle_eleve: "Je sais déterminer une droite de régression à l'aide d'un logiciel ou par calcul." }

prerequis:
  - { code: R1, libelle: "Dérivation, fonctions usuelles, sens de variation", chapitre_origine: "1SPE-DERIVATION-GLOBAL" }
  - { code: R2, libelle: "Statistique descriptive à une variable (moyenne, écart type)", chapitre_origine: "2NDE" }

situation_accroche: >
  Une entreprise cherche à minimiser son coût moyen de production, un biologiste modélise
  la croissance d'une population par une fonction du temps : dans les deux cas, l'étude
  complète d'une fonction (variations, convexité, résolution d'équation) permet de répondre
  à une question concrète. Ce chapitre réinvestit et étend l'étude de fonctions vue en
  première pour résoudre des problèmes issus de contextes variés.

temps_estime_h: { parcours1: 12, parcours2: 10, parcours3: 8 }
