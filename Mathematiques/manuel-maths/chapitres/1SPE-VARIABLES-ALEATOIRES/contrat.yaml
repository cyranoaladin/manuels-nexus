situation_accroche: >
  Un assureur propose un contrat couvrant la casse d'un smartphone. La prime annuelle est de 50 euros. En cas de casse, l'assureur rembourse 300 euros. Si la probabilite de casse est de 1/10, ce contrat est-il avantageux pour l'assure ? Pour l'assureur ? Un probleme de decision qui se ramene a l'etude de l'esperance d'une variable aleatoire.

temps_estime_h: { parcours1: 14, parcours2: 11, parcours3: 9 }
