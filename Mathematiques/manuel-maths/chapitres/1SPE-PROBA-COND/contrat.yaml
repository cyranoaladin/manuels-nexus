situation_accroche: >
  Un test de depistage detecte correctement 95 % des personnes malades, mais donne aussi un resultat positif chez 3 % des personnes saines. Si 1 % de la population est atteinte, quelle est la probabilite d'etre reellement malade quand le test est positif ? Un probleme qui necessite les probabilites conditionnelles.

temps_estime_h: { parcours1: 12, parcours2: 10, parcours3: 8 }
