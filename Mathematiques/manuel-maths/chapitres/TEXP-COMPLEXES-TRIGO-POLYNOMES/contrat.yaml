chapitre: TEXP-COMPLEXES-TRIGO-POLYNOMES
niveau: TEXPERTES
theme: COMPLEXES-TRIGO-POLYNOMES
titre: "Nombres complexes : trigonométrie et équations polynomiales"
statut: valide   # valide humainement le 2026-08-06 (branche terminale/collection-v1, creation ex nihilo)

capacites:
  - { code: C1, ref_capacite: TEXP-CTP-C1, libelle_eleve: "Je sais passer de la forme algébrique d'un nombre complexe à sa forme trigonométrique ou exponentielle, et inversement." }
  - { code: C2, ref_capacite: TEXP-CTP-C2, libelle_eleve: "Je sais utiliser les formules d'Euler et de Moivre pour transformer des expressions trigonométriques et calculer des puissances de nombres complexes." }
  - { code: C3, ref_capacite: TEXP-CTP-C3, libelle_eleve: "Je sais démontrer une formule d'addition trigonométrique à partir du produit scalaire." }
  - { code: C4, ref_capacite: TEXP-CTP-C4, libelle_eleve: "Je sais résoudre une équation polynomiale de degré 2, ou de degré 3 quand une racine est connue, et factoriser un polynôme dont une racine est connue." }
  - { code: C5, ref_capacite: TEXP-CTP-C5, libelle_eleve: "Je sais démontrer la factorisation de $z^n-a^n$ par $z-a$, celle de $P(z)$ par $z-a$ si $P(a)=0$, et que le nombre de racines d'un polynôme est majoré par son degré." }
  - { code: C6, ref_capacite: TEXP-CTP-C6, libelle_eleve: "Je sais utiliser les nombres complexes pour étudier des configurations du plan (alignement, orthogonalité, longueurs, angles, ensembles de points)." }
  - { code: C7, ref_capacite: TEXP-CTP-C7, libelle_eleve: "Je sais déterminer l'ensemble des racines n-ièmes de l'unité et les utiliser pour étudier des polygones réguliers." }

prerequis:
  - { code: R1, libelle: "Nombres complexes : module, argument, affixe", chapitre_origine: "TEXP-COMPLEXES-ALGEBRE-GEOMETRIE" }
  - { code: R2, libelle: "Fonction exponentielle, formules trigonométriques de base", chapitre_origine: "TSPE-LOGARITHME" }

situation_accroche: >
  L'exponentielle imaginaire $\mathrm{e}^{i\theta}$, découverte par Euler, relie de façon
  spectaculaire l'analyse et la trigonométrie : $\mathrm{e}^{i\pi}+1=0$, une des formules les
  plus célèbres des mathématiques, unit cinq constantes fondamentales. Ce chapitre
  explore cette forme exponentielle des nombres complexes, ses applications en
  trigonométrie, et l'étude des équations polynomiales dans $\mathbb{C}$.

temps_estime_h: { parcours1: 14, parcours2: 11, parcours3: 9 }
