chapitre: TCOMPL-CORRELATION-CAUSALITE
niveau: TCOMPL
theme: CORRELATION-CAUSALITE
titre: "Corrélation et causalité"
statut: valide   # valide humainement le 2026-08-06 (branche terminale/collection-v1, creation ex nihilo)

capacites:
  - { code: C1, ref_capacite: TCOMPL-CORR-C1, libelle_eleve: "Je sais représenter un nuage de points et calculer les coordonnées de son point moyen." }
  - { code: C2, ref_capacite: TCOMPL-CORR-C2, libelle_eleve: "Je sais déterminer la droite des moindres carrés d'un ajustement affine et calculer un coefficient de corrélation." }
  - { code: C3, ref_capacite: TCOMPL-CORR-C3, libelle_eleve: "Je sais me ramener à un ajustement affine par changement de variable." }
  - { code: C4, ref_capacite: TCOMPL-CORR-C4, libelle_eleve: "Je sais utiliser un ajustement affine pour interpoler ou extrapoler une valeur, avec un regard critique sur la validité de l'extrapolation." }
