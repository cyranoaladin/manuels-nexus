prerequis:
  - { code: R1, libelle: "Statistique descriptive à une variable", chapitre_origine: "2NDE" }
  - { code: R2, libelle: "Fonction logarithme", chapitre_origine: "TCOMPL-LOGARITHME-HISTORIQUE" }

situation_accroche: >
  Les ventes de glaces et les noyades augmentent toutes deux en été : faut-il en conclure
  que manger une glace cause la noyade ? Cet exemple absurde illustre un piège
  statistique fréquent : confondre corrélation et causalité. Ce chapitre approfondit
  l'étude des séries statistiques à deux variables et développe un regard critique sur
  l'interprétation d'une corrélation observée.

temps_estime_h: { parcours1: 10, parcours2: 8, parcours3: 6 }
