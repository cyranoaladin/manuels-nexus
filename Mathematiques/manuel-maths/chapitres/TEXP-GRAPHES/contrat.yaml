situation_accroche: >
  En 1736, Euler résout le célèbre problème des sept ponts de Königsberg (existe-t-il
  une promenade empruntant chaque pont une seule fois ?) en inventant une nouvelle
  branche des mathématiques : la théorie des graphes. Aujourd'hui, les graphes modélisent
  les réseaux sociaux, les routes, Internet, et bien d'autres systèmes de relations entre
  objets. Ce chapitre introduit le vocabulaire fondamental des graphes et leur lien avec
  le calcul matriciel.

temps_estime_h: { parcours1: 12, parcours2: 10, parcours3: 8 }
