  - { code: C2, ref_capacite: TCOMPL-ATT-C2, libelle_eleve: "Je sais calculer explicitement des probabilités pour une variable aléatoire suivant une loi géométrique." }
  - { code: C3, ref_capacite: TCOMPL-ATT-C3, libelle_eleve: "Je sais utiliser la caractérisation d'une loi géométrique par l'absence de mémoire dans un problème concret." }
  - { code: C4, ref_capacite: TCOMPL-ATT-C4, libelle_eleve: "Je sais définir la loi exponentielle (densité, fonction de répartition, espérance) et sa propriété d'absence de mémoire." }
