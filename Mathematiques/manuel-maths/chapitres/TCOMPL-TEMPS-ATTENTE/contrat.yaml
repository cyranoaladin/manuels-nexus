situation_accroche: >
  Combien de temps faut-il attendre le prochain bus, ou avant qu'un atome radioactif ne
  se désintègre ? Ces phénomènes partagent une propriété étonnante : l'\og absence de
  mémoire \fg{}, le temps déjà écoulé n'influence pas le temps d'attente restant. Ce
  chapitre étudie les deux lois qui modélisent ce type de temps d'attente : la loi
  géométrique (temps discret) et la loi exponentielle (temps continu).

temps_estime_h: { parcours1: 12, parcours2: 10, parcours3: 8 }
