chapitre: TSPE-COMBINATOIRE
niveau: TSPE
theme: COMBINATOIRE
titre: "Combinatoire et dénombrement"
statut: valide   # valide humainement le 2026-08-06 (branche terminale/collection-v1, creation ex nihilo)

capacites:
  - { code: C1, ref_capacite: TSPE-COMBINATOIRE-C1, libelle_eleve: "Je sais choisir une représentation adaptée (ensemble, arbre, tableau, diagramme) pour résoudre un problème de dénombrement." }
  - { code: C2, ref_capacite: TSPE-COMBINATOIRE-C2, libelle_eleve: "Je sais effectuer des dénombrements simples en utilisant les principes additif et multiplicatif, les permutations et les combinaisons." }
  - { code: C3, ref_capacite: TSPE-COMBINATOIRE-C3, libelle_eleve: "Je sais démontrer par dénombrement que la somme des (n parmi k) pour k de 0 à n vaut 2 puissance n." }
  - { code: C4, ref_capacite: TSPE-COMBINATOIRE-C4, libelle_eleve: "Je sais démontrer la relation de Pascal par le calcul et par une méthode combinatoire." }

prerequis:
  - { code: R1, libelle: "Notions ensemblistes de base (appartenance, sous-ensemble, réunion, intersection)", chapitre_origine: "2GT" }
  - { code: R2, libelle: "Raisonnement par récurrence", chapitre_origine: "TSPE-SUITES-LIMITES" }

situation_accroche: >
  Un mot de passe de 4 caracteres, un tirage de cartes, un trajet dans une ville en
  damier : combien de possibilites dans chaque cas ? La combinatoire fournit les
  outils rigoureux pour repondre a ces questions, sans avoir a tout enumerer.

temps_estime_h: { parcours1: 12, parcours2: 10, parcours3: 8 }
