chapitre: TCOMPL-INFERENCE-BAYESIENNE
niveau: TCOMPL
theme: INFERENCE-BAYESIENNE
titre: "Inférence bayésienne"
statut: valide   # valide humainement le 2026-08-06 (branche terminale/collection-v1, creation ex nihilo)

capacites:
  - { code: C1, ref_capacite: TCOMPL-BAYES-C1, libelle_eleve: "Je sais calculer des probabilités dans des situations faisant intervenir des probabilités conditionnelles." }
  - { code: C2, ref_capacite: TCOMPL-BAYES-C2, libelle_eleve: "Je sais utiliser la formule de Bayes pour calculer une probabilité a posteriori $P_B(A)$ à partir de $P_A(B)$, $P(A)$ et $P(B)$." }
  - { code: C3, ref_capacite: TCOMPL-BAYES-C3, libelle_eleve: "Je sais distinguer $P_B(A)$ (probabilité a posteriori) de $P_A(B)$ (probabilité a priori inversée) dans un problème concret." }
  - { code: C4, ref_capacite: TCOMPL-BAYES-C4, libelle_eleve: "Je sais définir sensibilité, spécificité, valeur prédictive positive et négative d'un test, et les relier aux probabilités conditionnelles." }
  - { code: C5, ref_capacite: TCOMPL-BAYES-C5, libelle_eleve: "Je sais étudier, en fonction de la prévalence, la valeur prédictive positive d'un test, et interpréter le résultat." }

prerequis:
  - { code: R1, libelle: "Probabilités conditionnelles, arbres pondérés", chapitre_origine: "1SPE-PROBA-COND" }

situation_accroche: >
  Un test de dépistage d'une maladie rare est positif : quelle est la probabilité réelle
  d'être malade ? L'intuition trompe souvent : même un test très fiable peut donner
  une majorité de faux positifs si la maladie est rare. Ce chapitre introduit le
  raisonnement bayésien, à la base de nombreuses décisions en médecine, justice et
  intelligence artificielle.

temps_estime_h: { parcours1: 10, parcours2: 8, parcours3: 6 }
