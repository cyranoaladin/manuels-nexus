chapitre: TSPE-CONTINUITE
niveau: TSPE
theme: CONTINUITE
titre: "Continuité des fonctions d'une variable réelle"
statut: valide   # valide humainement le 2026-08-05 (branche terminale/collection-v1, creation ex nihilo)

capacites:
  - { code: C1, ref_capacite: TSPE-CONTIN-C1, libelle_eleve: "Je sais étudier l'existence, l'unicité et l'encadrement des solutions d'une équation f(x) = k en utilisant le théorème des valeurs intermédiaires." }
  - { code: C2, ref_capacite: TSPE-CONTIN-C2, libelle_eleve: "Je sais étudier une suite définie par récurrence u(n+1) = f(u(n)) lorsque f est continue d'un intervalle dans lui-même." }

prerequis:
  - { code: R1, libelle: "Suites : limites, théorèmes de convergence", chapitre_origine: "TSPE-SUITES-LIMITES" }
  - { code: R2, libelle: "Limites de fonctions, comparaison, asymptotes", chapitre_origine: "TSPE-LIMITES-FONCTIONS" }
  - { code: R3, libelle: "Dérivation : sens de variation d'une fonction", chapitre_origine: "1SPE-DERIVATION-GLOBAL" }
  - { code: R4, libelle: "Notion intuitive de continuité (courbe sans saut)", chapitre_origine: "1SPE-DERIVATION-LOCAL" }

situation_accroche: >
  Une entreprise modélise son bénéfice quotidien par une fonction continue du prix de
  vente. Existe-t-il un prix pour lequel le bénéfice est exactement nul ? Peut-on
  l'encadrer sans le calculer exactement ? Le théorème des valeurs intermédiaires
  répond à ces questions et permet d'étudier des suites définies par récurrence.

temps_estime_h: { parcours1: 10, parcours2: 8, parcours3: 6 }
